# Copy to ~/.config/halo-linux/config.yaml
node:
  display_name: "My Halo Node"

# Set HALO_INFERENCE_API_KEY in the environment for authenticated providers.
# Do not place API keys directly in this YAML file.
inference:
  endpoint: "http://127.0.0.1:11434/v1"
  model: "change-to-your-installed-model"

storage:
  # Optionally override XDG data home:
  # data_dir: "~/halo-data"

audio:
  enabled: false

sync:
  enabled: false
