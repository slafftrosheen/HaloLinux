# Initial Trixie Desktop configuration: memory-only, no provider required.
# Copy to ~/.config/halo-linux/config.yaml (mode 0600).
node:
  display_name: "My Halo Node"

# Inference is OPT-IN. Remove the # from both lines after installing
# an actual local model/provider, and verify with 'halo-node provider check'.
# Secrets must be supplied through HALO_INFERENCE_API_KEY, not the YAML file.
inference:
  # endpoint: "http://127.0.0.1:11434/v1"
  # model: "replace-with-actually-installed-model"

storage:
  # data_dir: "~/halo-data"

audio:
  enabled: false

sync:
  enabled: false
